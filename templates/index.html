<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CineVerse AI | Movie Recommendation System</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/logo.png') }}?v=2"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid"></div>
    </div>


    <!-- Main Website -->
    <main class="container">

        <!-- Hero -->
        <section class="hero">

            <div class="badge">
                <span class="status-dot"></span>
                AI-POWERED MOVIE DISCOVERY
            </div>

            <h1>
                Discover Your
                <span>Next Favorite Movie</span>
            </h1>

            <p class="subtitle">
                Explore intelligent movie recommendations powered by
                Machine Learning.
            </p>


            <!-- Search -->
            <div class="search-container">

                <div class="search-box">

                    <div class="search-icon">
                        🔍
                    </div>

                    <input
                        type="text"
                        id="movieInput"
                        placeholder="Search any movie..."
                        autocomplete="off"
                    >

                    <button id="recommendButton">
                        <span>Discover</span>
                        <span class="button-arrow">→</span>
                    </button>

                </div>


                <!-- Suggestions -->
                <div id="suggestions"></div>

            </div>


            <!-- Quick Information -->
            <div class="features">

                <div class="feature">
                    <span>✦</span>
                    <p>Machine Learning</p>
                </div>
                <div class="feature">
                    <span>∞</span>
                    <p>Global Movies</p>
                </div>

            </div>

        </section>


        <!-- Message -->
        <div id="message"></div>


        <!-- Results -->
        <section id="results">

            <div class="results-header">

                <div>

                    <p class="section-label">
                        PERSONALIZED RESULTS
                    </p>

                    <h2 id="resultsTitle"></h2>

                </div>


                <div
                    id="recommendationSource"
                    class="source-badge"
                ></div>

            </div>


            <!-- Movie Cards -->
            <div id="recommendations"></div>


            <!-- Load More -->
            <div class="load-more-container">

                <button
                    id="loadMoreButton"
                    class="load-more-button"
                >
                    <span>Load More</span>
                    <span>↓</span>
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>
            CINEVERSE AI
            <span>•</span>
            Intelligent Movie Discovery
        </p>

    </footer>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
